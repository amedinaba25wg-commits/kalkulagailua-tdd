name: Pipeline CI Avanzado
on:
 pull_request:
  branches: [ "main" ]
jobs:
 # JOB 1: Análisis de Calidad (Linting)
 code_quality:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17 y Caché
      uses: actions/setup-java@v4
      with:
        java-version: '17' # Asegúrate de usar la versión correcta
        distribution: 'temurin'
        cache: 'maven' # ¡Esto activa la caché de dependencias mágicamente!

    - name: Ejecutar Checkstyle
      run: mvn checkstyle:check
 # JOB 2: Testing y Cobertura
 test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java 17 y Caché
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Ejecutar Tests Unitarios (Genera reporte JaCoCo)
      run: mvn test

    - name: Subir Reporte de Cobertura a GitHub
      uses: actions/upload-artifact@v4
      if: always() # Garantiza que se suba el reporte aunque algún test falle
      with:
        name: reporte-cobertura-jacoco
        path: target/site/jacoco/
        retention-days: 7
 # JOB 3: Empaquetado de la Aplicación
 package:
  needs: [code_quality, test] # Este job espera a que los dos anteriores terminen con éxito
  runs-on: ubuntu-latest
  steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Construir el JAR (saltando tests porque ya pasaron)
      run: mvn package -DskipTests

    - name: Subir Artefacto JAR
      uses: actions/upload-artifact@v4
      with:
        name: calculadora-app
        path: target/*.jar
        retention-days: 7